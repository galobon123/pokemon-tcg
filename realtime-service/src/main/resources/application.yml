server:
  port: ${PORT:8082}

spring:
  application:
    name: realtime-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pokemontcg}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration/realtime
    table: realtime_flyway_schema_history
    baseline-version: 0

app:
  jwt:
    secret: ${JWT_SECRET:your_very_long_secret_here_min_32_chars}

game:
  service:
    url: ${GAME_SERVICE_URL:http://localhost:8081}

