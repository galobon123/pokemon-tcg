server:
  port: ${PORT:8083}

spring:
  application:
    name: card-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pokemontcg}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: card_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  task:
    scheduling:
      pool:
        size: 2

pokemontcg:
  base-url: https://api.pokemontcg.io/v2
  api-key: ${POKEMON_TCG_API_KEY:}

card:
  sync:
    cron: "${CARD_SYNC_CRON:0 0 3 * * MON}"
